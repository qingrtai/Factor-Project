# ==============================================================================
# 测试集评估 - 最佳轮次配置
# ==============================================================================
# 说明：
# 1. 每个实验需要指定一个最佳轮次（round）用于测试集评估
# 2. 轮次从 0 开始计数（round 0 是第一轮）
# 3. 根据验证集的 val_score 选择得分最高的轮次
# 4. factor_baseline 只有一轮，固定为 0
# ==============================================================================

experiments:
  factor_baseline: 0  # 基线实验固定为第0轮
  iterative_baseline: 1
  iterative_global_memory: 1
  iterative_negative_memory: 2
  iterative_baseline_with_reports: 2
  iterative_negative_memory_with_reports: 3


